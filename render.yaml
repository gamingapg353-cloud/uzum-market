# Render.com sozlamasi: New + -> Blueprint -> shu repo tanlanadi.
# Maxfiy qiymatlar (sync: false) Render panelida qo'lda kiritiladi.
services:
  - type: web
    name: uzum-market-samandar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HOST
        value: 0.0.0.0
      # Foydalanuvchilar saytni Netlify orqali ochadi — Google/GitHub ham shu manzilga qaytadi
      - key: BASE_URL
        value: https://uzum-market-uz.netlify.app
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
