# Netlify faqat sahifalarni ko'rsatadi; server (server.py) PythonAnywhere'da ishlaydi.
# /api va /auth so'rovlari PythonAnywhere'dagi serverga uzatiladi (foydalanuvchi faqat Netlify manzilini ko'radi).
# PythonAnywhere manzili boshqacha chiqsa — quyidagi ikki qatordagi manzilni almashtiring.

[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://uzummarket.pythonanywhere.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://uzummarket.pythonanywhere.com/auth/:splat"
  status = 200
  force = true

# Server fayllari va maxfiy narsalar Netlify'da ochiq turmasin
[[redirects]]
  from = "/server.py"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true
