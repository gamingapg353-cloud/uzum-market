# Netlify: sahifalar + server (Netlify Functions, TypeScript) — tashqi server kerak emas.
# /api/* va /auth/* ni netlify/functions/api.mts bajaradi (ma'lumotlar Netlify Blobs'da).
# Kalitlar: Site configuration -> Environment variables (OWNER_EMAIL, OWNER_PASSWORD, GOOGLE_*, GITHUB_*, SMTP_*).

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Kod va server fayllari brauzerda ochiq turmasin
[[redirects]]
  from = "/server.py"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/wsgi.py"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
